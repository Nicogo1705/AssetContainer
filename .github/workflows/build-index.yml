name: "Rebuild the catalogue (index.lock.json)"
run-name: "Rebuilding the catalogue index"

# On merge to main, regenerate the aggregate consumed by the app by crawling every
# registry entry (clone, hash, detect Stride version, resolve dependencies) and commit it.

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "catalog/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with daily-refresh.yml so the two never run at once; don't cancel an in-flight
  # refresh — let it finish, then this runs (a full rebuild supersedes it anyway).
  group: build-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout registry
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the tool reads each entry's creation date (addedAt) via git log.
          fetch-depth: 0

      - name: Checkout the StrideAssetStore tool
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Nicogo1705/StrideAssetStore
          # Deliberately unpinned (tracks the tool's default branch): same owner as this
          # registry, and pinning would mean a PR here on every tool change.
          path: tool

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Build index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet run --project tool/src/StrideAssetStore.Cli/StrideAssetStore.Cli.csproj -c Release -- \
            build-index --container . --source git --cache .cache --stars --out index.lock.json

      # The generated index is committed straight to main and served to every client, and nothing
      # checked it against the schema it is supposed to satisfy — which is exactly how a `forks`
      # field reached the published index while the schema forbade it.
      - name: The generated index matches its schema
        run: |
          python3 -m venv /tmp/schema-check
          /tmp/schema-check/bin/pip install --quiet jsonschema==4.23.0
          /tmp/schema-check/bin/python - <<'CHECK'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator

          schema = json.loads(pathlib.Path("schemas/index-lock.schema.json").read_text(encoding="utf-8"))
          index = json.loads(pathlib.Path("index.lock.json").read_text(encoding="utf-8"))
          failed = False
          for error in Draft202012Validator(schema).iter_errors(index):
              location = "/".join(str(p) for p in error.absolute_path) or "(root)"
              print(f"::error::index.lock.json {location}: {error.message}")
              failed = True

          sys.exit(1 if failed else 0)
          CHECK

      - name: Commit updated index
        run: |
          git config user.name  "asset-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: rebuild index.lock.json [skip ci]"
            git pull --rebase origin main
            git push
          fi
