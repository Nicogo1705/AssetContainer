name: "Validate the registry entries of a PR"

# Validates every registry entry on a pull request: schemas, clone + pin commit,
# AssetData hash, Stride version, and dependency consistency. Runs the `strideassetstore` CLI.

on:
  pull_request:
    paths:
      - "registry/**"
      - "schemas/**"
      - "catalog/**"

permissions:
  contents: read
  pull-requests: write

# Supersede in-flight runs when a PR is updated, so only the latest push is validated.
concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registry
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout the StrideAssetStore tool
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Nicogo1705/StrideAssetStore
          # Deliberately unpinned — see build-index.yml.
          path: tool

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      # Runs on every PR, including schema/catalog-only ones. Those skip the per-asset validation
      # below, which used to leave them with a green run that proved nothing: a schema that no longer
      # loads, or one that no longer accepts the entries already in the registry, went unnoticed.
      # Offline and deterministic — no clone, nothing that a transiently unreachable asset can break.
      # What it covers: the schemas compile, the catalog files parse,
      # and the entries in this repository still satisfy the registry-entry schema. Whether an asset's
      # category and licence exist in the catalog is checked per asset by the step below — those live
      # in the author's manifest.json, not here, so it needs a clone.
      - name: Schemas compile and the registry entries still satisfy them
        run: |
          # A venv, not the system Python: Ubuntu marks it externally managed (PEP 668) and a bare
          # `pip install` fails there. Version pinned so an upstream release can't turn the registry
          # red without a change here. `python3` is preinstalled on the runner; `python` may not be.
          python3 -m venv /tmp/schema-check
          /tmp/schema-check/bin/pip install --quiet jsonschema==4.23.0
          /tmp/schema-check/bin/python - <<'CHECK'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator

          def load(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except Exception as error:
                  print(f"::error file={path}::not valid JSON: {error}")
                  sys.exit(1)

          failed = False
          for schema_path in sorted(pathlib.Path("schemas").glob("*.json")):
              schema = load(schema_path)
              try:
                  Draft202012Validator.check_schema(schema)
              except Exception as error:
                  print(f"::error file={schema_path}::not a usable JSON Schema: {error}")
                  failed = True

          for catalog_path in sorted(pathlib.Path("catalog").glob("*.json")):
              load(catalog_path)

          validator = Draft202012Validator(load("schemas/registry-entry.schema.json"))
          for entry_path in sorted(pathlib.Path("registry").glob("*.json")):
              entry = load(entry_path)
              for error in validator.iter_errors(entry):
                  location = "/".join(str(p) for p in error.absolute_path) or "(root)"
                  print(f"::error file={entry_path}::{location}: {error.message}")
                  failed = True

          sys.exit(1 if failed else 0)
          CHECK

      - name: Determine changed assets
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PR is judged on the registry entries it touches, not the whole catalog
          # (so an intentionally-broken demo asset can't fail unrelated PRs).
          # `--json files` lists deleted paths too, and a removal PR is checked out without them:
          # passing --only for an id no longer in the registry fails the run, so a takedown —
          # the procedure TAKEDOWN.md documents — could never be merged. Hence the -f test.
          only=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
                   --json files -q '.files[].path' \
                 | grep -E '^registry/.*\.json$' \
                 | while read -r path; do [ -f "$path" ] && echo "$path"; done \
                 | sed -E 's#registry/(.*)\.json#--only \1#' \
                 | tr '\n' ' ')
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "Scoped to: ${only:-<all assets>}"

      - name: Validate
        id: validate
        # Only run per-asset validation when the PR actually touches registry entries. A schema/catalog-only
        # PR would otherwise validate EVERY asset (cloning each repo), so one transiently offline asset could
        # fail an unrelated change.
        if: steps.changed.outputs.only != ''
        run: |
          set -o pipefail
          dotnet run --project tool/src/StrideAssetStore.Cli/StrideAssetStore.Cli.csproj -c Release -- \
            validate --container . --source git --cache .cache ${{ steps.changed.outputs.only }} | tee validate.out

      - name: Comment results on PR
        if: always()
        # Fork PRs get a read-only GITHUB_TOKEN, so commenting 403s — don't fail the run over it.
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('validate.out') ? fs.readFileSync('validate.out', 'utf8') : 'No registry entries changed — per-asset validation skipped.';
            // Strip any residual ANSI escape codes so the comment reads cleanly.
            const body = raw.replace(/\x1b\[[0-9;]*m/g, '');
            const outcome = '${{ steps.validate.outcome }}';
            const status = outcome === 'success' ? '✅ Validation passed'
              : outcome === 'skipped' ? 'ℹ️ No registry entries changed — per-asset validation skipped'
              : '❌ Validation failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### ${status}\n\n\`\`\`\n${body.slice(0, 60000)}\n\`\`\``,
            });
