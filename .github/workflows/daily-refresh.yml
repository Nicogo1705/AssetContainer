name: "Daily refresh of the catalogue and star counts"

# Incremental daily refresh of index.lock.json:
#   - detects which assets' tracked ref moved (via git ls-remote — no clone) and re-fetches ONLY those,
#   - refreshes GitHub stars and tag versions for every asset (cheap, API/ls-remote).
# Scales to many assets: on a quiet day nothing is cloned. The event-driven full build
# (build-index.yml) still runs on registry changes.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout registry
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the tool reads each entry's creation date (addedAt) via git log.
          fetch-depth: 0

      - name: Checkout the StrideAssetStore tool
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Nicogo1705/StrideAssetStore
          # Deliberately unpinned — see build-index.yml.
          path: tool

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Incremental refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet run --project tool/src/StrideAssetStore.Cli/StrideAssetStore.Cli.csproj -c Release -- \
            build-index --container . --source git --cache .cache --incremental --stars --out index.lock.json

      # The generated index is committed straight to main and served to every client, and nothing
      # checked it against the schema it is supposed to satisfy — which is exactly how a `forks`
      # field reached the published index while the schema forbade it.
      - name: The generated index matches its schema
        run: |
          python3 -m venv /tmp/schema-check
          /tmp/schema-check/bin/pip install --quiet jsonschema==4.23.0
          /tmp/schema-check/bin/python - <<'CHECK'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator

          schema = json.loads(pathlib.Path("schemas/index-lock.schema.json").read_text(encoding="utf-8"))
          index = json.loads(pathlib.Path("index.lock.json").read_text(encoding="utf-8"))
          failed = False
          for error in Draft202012Validator(schema).iter_errors(index):
              location = "/".join(str(p) for p in error.absolute_path) or "(root)"
              print(f"::error::index.lock.json {location}: {error.message}")
              failed = True

          sys.exit(1 if failed else 0)
          CHECK

      - name: Commit updated index
        run: |
          git config user.name  "asset-store-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: daily incremental index refresh [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Report API rate limit budget
        if: always()
        # Watch this as the catalog grows: when `remaining` gets low (~100+ assets),
        # switch the stars refresh to ETags/GraphQL batching.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/rate_limit \
            | jq -r '.resources.core | "x-ratelimit remaining: \(.remaining)/\(.limit) (resets \(.reset | todate))"'
